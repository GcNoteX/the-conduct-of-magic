name: Checks

on:
  pull_request:
  push:
    branches: [main]

env:
  GODOT_VERSION: 4.7.2-stable
  GDTOOLKIT_VERSION: 4.5.0

jobs:
  lint:
    name: Lint and format (changed files)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==${GDTOOLKIT_VERSION}"
      - name: Run gdformat and gdlint
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD -- '*.gd' \
            | grep -vE '^(addons|demo)/' || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No GDScript files changed."
            exit 0
          fi
          printf 'Checking:\n'; printf '  %s\n' "${files[@]}"
          status=0
          gdformat --check "${files[@]}" || status=1
          gdlint "${files[@]}" || status=1
          exit $status

  scripts:
    name: Godot script check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot
      - name: Import project
        run: timeout 600 ~/godot/godot --headless --path . --import || true
      - name: Compile every script
        run: |
          set -o pipefail
          timeout 300 ~/godot/godot --headless --path . res://tools/ci/check_scripts.tscn 2>&1 | tee check.log
          if grep -qE "Parse Error|Compile Error" check.log; then
            echo "::error::Script errors found, see the log above."
            exit 1
          fi
      - name: Run GUT tests
        run: |
          set -o pipefail
          timeout 600 ~/godot/godot --headless --path . -s addons/gut/gut_cmdln.gd 2>&1 | tee gut.log
          # GUT skips a test script that doesn't load instead of failing, so catch that here
          if grep -qE "Parse Error|Failed to load script" gut.log; then
            echo "::error::A test script didn't load, see the log above."
            exit 1
          fi
      - name: Run rule tests
        run: timeout 300 ~/godot/godot --headless --path . res://tests/test_inscription_board.tscn
      - name: Run item overview tests
        run: timeout 300 ~/godot/godot --headless --path . res://tests/test_item_overview.tscn
      - name: Run disenchant tests
        run: timeout 300 ~/godot/godot --headless --path . res://tests/test_disenchant_board.tscn
      - name: Run solvability checker tests
        run: timeout 300 ~/godot/godot --headless --path . res://tests/test_solvability_checker.tscn
      - name: Run scene bake tests
        run: timeout 300 ~/godot/godot --headless --path . res://tests/test_scene_bake.tscn
      - name: Run DevLog tests
        run: timeout 300 ~/godot/godot --headless --path . res://tests/test_dev_log.tscn
